<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Hợp 180 Bài Nền Tảng Đạo Đức</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Thiết lập nền cánh đồng xanh cho trang */
        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Ảnh cánh đồng xanh bát ngát từ Unsplash */
            background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Khung chứa tổng thể */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.85); /* Màu trắng bán trong suốt */
            backdrop-filter: blur(12px); /* Hiệu ứng kính mờ */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #2e7d32; /* Màu xanh lá đậm */
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Lưới hiển thị các link */
        .grid-container {
            display: grid;
            /* Tự động chia cột, mỗi cột rộng tối thiểu 120px */
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 20px;
        }

        /* Thiết kế cho từng ô link */
        .link-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            background: #ffffff;
            border: 2px solid #a5d6a7; /* Viền xanh lá nhạt */
            border-radius: 15px;
            text-decoration: none;
            color: #2e7d32;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Hiệu ứng khi di chuột vào ô link */
        .link-item:hover {
            transform: translateY(-5px); /* Nổi lên trên */
            box-shadow: 0 10px 20px rgba(46, 125, 50, 0.2); /* Đổ bóng xanh */
            background: #e8f5e9; /* Nền đổi sang xanh rất nhạt */
            border-color: #4caf50;
            color: #1b5e20;
        }

        /* Thiết kế icon */
        .link-item i {
            font-size: 28px;
            margin-bottom: 12px;
            color: #4caf50;
        }

        .link-item:hover i {
            color: #2e7d32;
        }

        /* Tên bài */
        .link-item span {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Thanh cuộn */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #81c784; 
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4caf50; 
        }

        /* Responsive cho thiết bị di động */
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 15px;
            }
            .link-item {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tổng Hợp 180 Bài Nền Tảng Đạo Đức</h1>
        
        <div class="grid-container" id="links-wrapper">
            </div>
    </div>

    <script>
        // Lấy thẻ div chứa lưới
        const wrapper = document.getElementById('links-wrapper');
        
        // Vòng lặp từ 1 đến 180 để tạo HTML cho từng link
        for (let i = 1; i <= 180; i++) {
            // Tạo thẻ a
            const linkTag = document.createElement('a');
            linkTag.href = `index${i}.html`;
            linkTag.className = 'link-item';
            
            // Gắn icon và text vào thẻ a
            linkTag.innerHTML = `
                <i class="fa-solid fa-seedling"></i>
                <span>Bài ${i}</span>
            `;
            
            // Đưa thẻ a vào trong khung chứa
            wrapper.appendChild(linkTag);
        }
    </script>

</body>
</html>
